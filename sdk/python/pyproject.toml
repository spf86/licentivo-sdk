[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "licentivo-sdk"
version = "0.11.7"
description = "Licentivo software licensing client"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["cryptography>=44.0.1,<49"]

[project.urls]
Homepage = "https://www.licentivo.com/"
Documentation = "https://www.licentivo.com/en/docs.html#sdk"
Source = "https://github.com/spf86/licentivo-sdk"
Issues = "https://github.com/spf86/licentivo-sdk/issues"

[tool.setuptools]
py-modules = ["licentivo", "licentivo_tasks", "licentivo_logout"]
license-files = ["LICENSE", "NOTICE"]
