[package]
name = "licentivo"
version = "0.11.7"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "Licentivo application licensing: activation, verified grants and metered operations"
repository = "https://github.com/spf86/licentivo-sdk"
documentation = "https://www.licentivo.com/en/docs.html#sdk"
homepage = "https://www.licentivo.com/"
readme = "README.md"
include = ["src/**", "examples/**", "build.rs", "Cargo.toml", "README.md", "LICENSE", "NOTICE", "native/**"]

[dependencies]
serde_json = "1.0"

[build-dependencies]
cc = "1.2"
pkg-config = "0.3"
